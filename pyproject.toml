[project]
name = "scan3d"
version = "0.1.0"
description = "Local photo/video to 3D model service (COLMAP + OpenMVS) for macOS and Windows"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "opencv-python-headless>=4.10",
    "trimesh>=4.4",
    "fast-simplification>=0.1.9",
    "scipy>=1.13",
    "manifold3d>=3.0",
    "lxml>=5.0",
    "scikit-image>=0.24",
]

[project.optional-dependencies]
# Background removal for turntable scans (object rotates, camera is fixed).
masking = ["rembg[cpu]>=2.0.57"]
# Silhouette carving (black / shiny objects): SAM 2 segments the object in every frame.
# The official Hugging Face implementation: plain wheels on macOS, Windows and Linux (the `sam2`
# package on PyPI is a third-party source build; it is still used if installed instead).
silhouette = ["transformers>=4.56", "torch>=2.6", "torchvision>=0.21", "huggingface_hub>=0.24"]

[project.scripts]
scan3d = "app.cli:main"
scan3d-accuracy = "app.accuracy:main"
scan3d-doctor = "app.doctor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
