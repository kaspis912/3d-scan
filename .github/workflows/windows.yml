# Runs the real Windows installer and a complete test scan on a Windows machine.
# This is the end-to-end proof for Windows (CPU only: hosted runners have no GPU).
name: windows
on:
  push:
  workflow_dispatch:
jobs:
  install-and-selftest:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install (also runs scan3d-doctor and the test scan)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install_windows.ps1
      - name: Keep the logs if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-logs
          path: data/scan3d_selftest_*/log.txt
